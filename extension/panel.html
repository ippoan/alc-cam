<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>alc-cam 拠点中継</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>alc-cam 拠点中継</h1>
    <button id="toggle" type="button">開始</button>
  </header>
  <p class="note">配信はパネルを閉じても続きます (Chrome が動いている間ずっと)。「停止」で止めます。
    拠点とカメラは点呼の画面 (alc.ippoan.org) を開くと届く鍵で、録画の画面の紐づけから決まります。</p>

  <dl class="status">
    <dt>鍵</dt><dd id="st-token">なし</dd>
    <dt>担当カメラ</dt><dd id="st-config">-</dd>
    <dt>host</dt><dd id="st-host">停止</dd>
    <dt>シグナリング</dt><dd id="st-signal">停止</dd>
    <dt>見る人</dt><dd id="st-viewer">なし</dd>
    <dt>カメラ</dt><dd id="st-camera">-</dd>
    <dt>映像</dt><dd id="st-peer">-</dd>
    <dt>host 更新</dt><dd><span id="st-update">-</span> <button id="update-check" class="small" type="button">今すぐ確認</button></dd>
  </dl>

  <script type="module" src="panel.js"></script>
</body>
</html>
