# 拠点の Chrome 拡張が native messaging で起動する常駐 `alc-cam-host`。
# 拡張が開いている間だけ動き、カメラの RTSP を受けて (再エンコードなし) WebRTC で見る側へ P2P で送る。
# シグナリング (cf-alc-signaling の /cam-room) は拡張が持ち、ここへは stdin/stdout の JSON で中継される。
[package]
name = "alc-cam-host"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
cam-rtsp = { path = "../crates/cam-rtsp" }
cam-ptz = { path = "../crates/cam-ptz" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 暗号は pure Rust (Windows へのクロスビルドで OpenSSL / aws-lc を持ち込まない)
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
# 自己更新 (GitHub Release だけ)。TLS は rustls + ring (OpenSSL / aws-lc は持ち込まない)
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.10"

