# カメラの SD 録画を定期的に R2 へ取り込む Worker `alc-cam-sd-ingest`。
# wasm32 専用なので root の workspace から外し、ここを自分の workspace にする (lock も ingest/Cargo.lock)。
# 手順 (一覧・取り出し・Digest) は crates/cam-sd に在り、ここが持つのは VPC への fetch と R2 への流し込みだけ。
[package]
name = "alc-cam-sd-ingest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

# 使わない依存は入れない
[dependencies]
cam-sd = { path = "../crates/cam-sd" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["ReadableStream"] }
worker = "=0.8.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
