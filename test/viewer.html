<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>cam-room viewer (検証用)</title>
<!-- 見る側 (role=admin)。alc-app の useWebRtc('admin') の cam-room 分岐と同じ振る舞い:
     offer を受けて answer を作り、ICE の収集が終わってから候補入りの answer を 1 通で返す (non-trickle)。 -->
<video id="v" autoplay muted playsinline style="width:640px;background:#000"></video>
<pre id="st"></pre>
<script>
  const params = new URLSearchParams(location.search);
  const ws = new WebSocket(`ws://${location.host}/cam-room/${params.get('site') ?? 'test-site'}?role=admin`);
  const video = document.getElementById('v');
  window.camState = { ws: 'connecting', pc: 'new', offers: 0, ptz: { caps: null, results: [] } };
  // 首振り (データチャネル ptz)。e2e が ptzSend({action, dir, preset}) で押す
  let ptzChannel = null;
  window.ptzSend = (m) => ptzChannel?.readyState === 'open' && (ptzChannel.send(JSON.stringify({ type: 'ptz', ...m })), true);
  let pc = null;

  ws.onopen = () => (camState.ws = 'open');
  ws.onclose = () => (camState.ws = 'closed');
  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type !== 'sdp_offer') return;
    camState.offers++;
    pc?.close();
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.ontrack = (e) => (video.srcObject = new MediaStream([e.track]));
    pc.onconnectionstatechange = () => (camState.pc = pc.connectionState);
    pc.ondatachannel = (e) => {
      if (e.channel.label !== 'ptz') return;
      ptzChannel = e.channel;
      e.channel.onmessage = (m) => {
        const msg = JSON.parse(m.data);
        if (msg.event === 'caps') camState.ptz.caps = msg;
        else camState.ptz.results.push(msg);
      };
    };
    await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await new Promise((r) => {
      if (pc.iceGatheringState === 'complete') return r();
      pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r();
      setTimeout(r, 3000);
    });
    ws.send(JSON.stringify({ type: 'sdp_answer', sdp: pc.localDescription.sdp }));
  };

  // 届いた映像の量 (デコードできたフレーム数) を見えるようにする
  setInterval(async () => {
    if (!pc) return;
    for (const r of (await pc.getStats()).values()) {
      if (r.type === 'inbound-rtp' && r.kind === 'video') {
        camState.framesDecoded = r.framesDecoded;
        camState.codec = [...(await pc.getStats()).values()].find((c) => c.id === r.codecId)?.mimeType;
        camState.size = `${r.frameWidth}x${r.frameHeight}`;
      }
    }
    document.getElementById('st').textContent = JSON.stringify(camState, null, 1);
  }, 500);
</script>
</html>
