# PR / main: Rust のテストと Windows 向けの host のビルド。タグ v* では Windows 一式を Release に添付する。
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # SD 録画の切り出しの Worker (ingest/、別 workspace。直下の worker は wasm32 専用、ingest/api は native でも動く)。
  # デプロイはしない (手で wrangler deploy)。
  # 先頭の check-exposure.sh は「外から素で届かない・VPC Network と Hyperdrive は本番にだけ」の検査、
  # check-exposure-test.sh はその陰性対照 (wrangler.toml を崩すと exit 1 になること)。
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    # 実 DB のテスト (ingest/api/tests/db.rs) の接続先。runner の中の使い捨ての DB
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: 外から直接届かないことの検査 (wrangler.toml)
        run: bash scripts/check-exposure.sh
      - name: check-exposure.sh の陰性対照
        run: bash scripts/check-exposure-test.sh
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ingest
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      # テストの準備が流す SQL を ippoan/alc-migrations から取る (版は scripts/ALC_MIGRATIONS_REV)
      - run: bash scripts/fetch-migrations.sh
      # 単体テスト (宛先の検査・認可・入力) と api/tests/db.rs (実 DB)。接続文字列は runner の中の使い捨ての DB のもので、secret ではない
      - name: cargo test (api の単体・実 DB)
        env:
          CAM_TEST_ADMIN_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: cargo test --locked --workspace
      - run: cargo install -q worker-build@0.8.7 && worker-build --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 日本語を含む .ps1 は BOM が無いと Windows PowerShell 5.1 が Shift_JIS で読んで壊れる
      - name: PowerShell の構文と BOM
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in git ls-files '*.ps1') {
            $b = [IO.File]::ReadAllBytes($f)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { Write-Host "::error file=$f::UTF-8 BOM がありません"; $bad++ }
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p alc-cam-host
      # 拡張の CRX・update.xml・host の版情報 (scripts/pack-release.ps1)。
      # タグでは Secret ALC_CAM_EXTENSION_KEY (manifest の key の秘密鍵) で署名し、ID が違えば止まる。
      # PR / main では使い捨ての鍵で梱包の手順だけ確かめる (Secret は渡さない)
      - name: Release 用の CRX・update.xml・host
        shell: pwsh
        env:
          EXT_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ALC_CAM_EXTENSION_KEY || '' }}
        run: |
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            if (-not $env:EXT_KEY) { throw 'Secret ALC_CAM_EXTENSION_KEY がありません' }
            $key = Join-Path $env:RUNNER_TEMP 'ext-key.pem'
            [IO.File]::WriteAllText($key, $env:EXT_KEY)
            try { ./scripts/pack-release.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v')) -KeyPath $key }
            finally { Remove-Item -Force $key }
          } else {
            ./scripts/pack-release.ps1 -Version (Get-Content -Raw extension/manifest.json | ConvertFrom-Json).version
          }
      - name: パッケージ (初回の手入れ用。host・install スクリプト・拡張)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/alc-cam | Out-Null
          Copy-Item target/release/alc-cam-host.exe, host/install.ps1, host/install-admin.ps1, host/install.cmd, host/uninstall.cmd dist/alc-cam/
          Copy-Item -Recurse extension dist/alc-cam/extension
          Compress-Archive -Path dist/alc-cam/* -DestinationPath dist/alc-cam-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alc-cam-windows
          path: |
            dist/alc-cam-windows.zip
            dist/alc-cam.crx
            dist/update.xml
            dist/alc-cam-host.exe
            dist/alc-cam-host.json
      # 拠点 PC は update.xml (拡張) と alc-cam-host.json (host) を releases/latest から見るので、
      # Release を出すだけで更新が届く。版はタグ・manifest・Cargo.toml を揃えておく (pack-release.ps1 が確かめる)
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/alc-cam-windows.zip dist/alc-cam.crx dist/update.xml dist/alc-cam-host.exe dist/alc-cam-host.json --generate-notes

  # green の PR を merge する (ippoan/ci-workflows の reusable。merge は GitHub App の token で行う)。
  # デプロイはしない (ingest は手で wrangler deploy)。windows も PR で走るので needs に入れる
  auto-merge:
    name: Auto Merge
    needs: [test, ingest, windows]
    if: github.event_name == 'pull_request' && needs.test.result == 'success' && needs.ingest.result == 'success' && needs.windows.result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
      # 無いと startup_failure になる
      checks: read
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
