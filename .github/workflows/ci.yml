# PR / main: Rust のテストと Windows 向けの host のビルド。タグ v* では Windows 一式を Release に添付する。
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # SD 録画の切り出しの Worker (ingest/、別 workspace。直下の worker は wasm32 専用、ingest/api は native でも動く)。
  # デプロイは main への merge で .github/workflows/deploy.yml が本番へ出す (PR では --dry-run)。
  # 先頭の check-exposure.sh は「外から素で届かない・VPC Network は無く、VPC Service (カメラごと) と Hyperdrive は
  # 本番 (トップレベル) にだけ」の検査、
  # check-exposure-test.sh はその陰性対照 (wrangler.toml を崩すと exit 1 になること)。
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    # 実 DB のテスト (ingest/api/tests/db.rs) の接続先。runner の中の使い捨ての DB
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: 外から直接届かないことの検査 (wrangler.toml)
        run: bash scripts/check-exposure.sh
      - name: check-exposure.sh の陰性対照
        run: bash scripts/check-exposure-test.sh
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ingest
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      # テストの準備が流す SQL を ippoan/alc-migrations から取る (版は scripts/ALC_MIGRATIONS_REV)
      - run: bash scripts/fetch-migrations.sh
      # 単体テスト (宛先の検査・認可・入力) と api/tests/db.rs (実 DB)。接続文字列は runner の中の使い捨ての DB のもので、secret ではない
      - name: cargo test (api の単体・実 DB)
        env:
          CAM_TEST_ADMIN_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: cargo test --locked --workspace
      - run: cargo install -q worker-build@0.8.7 && worker-build --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 日本語を含む .ps1 は BOM が無いと Windows PowerShell 5.1 が Shift_JIS で読んで壊れる
      - name: PowerShell の構文と BOM
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in git ls-files '*.ps1') {
            $b = [IO.File]::ReadAllBytes($f)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { Write-Host "::error file=$f::UTF-8 BOM がありません"; $bad++ }
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p alc-cam-host
      # MSI は WiX 5.0.2 に固定 (v6 以降は OSMF の EULA の受諾が要り、無いと WIX7015 で止まる)
      - name: WiX 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      # Release に付ける host・拡張の zip・alc-cam.json・alc-cam.msi (scripts/pack-release.ps1)。PR / main でも作って手順を確かめる
      - name: 自己更新用の host・拡張 zip・版情報と初回用の MSI
        shell: pwsh
        run: |
          $ver = if ('${{ github.ref }}'.StartsWith('refs/tags/v')) { '${{ github.ref_name }}'.TrimStart('v') } else { (Get-Content -Raw extension/manifest.json | ConvertFrom-Json).version }
          ./scripts/pack-release.ps1 -Version $ver
      # 中身の表 (ファイル・HKCU・perUser・NeverOverwrite) と、runner のユーザーに入れて 自己更新の真似 → 修復 → 上げ → 下げ拒否 → 外す
      - name: MSI の検査
        shell: pwsh
        run: ./scripts/check-msi.ps1 -Msi dist/alc-cam.msi -Exe dist/alc-cam-host.exe -Version (Get-Content -Raw extension/manifest.json | ConvertFrom-Json).version
      - uses: actions/upload-artifact@v4
        with:
          name: alc-cam-windows
          path: |
            dist/alc-cam.msi
            dist/alc-cam-extension.zip
            dist/alc-cam-host.exe
            dist/alc-cam.json
      # 拠点 PC の host は releases/latest の alc-cam.json を見るので、Release を出すだけで host も拡張も更新が届く。
      # 版はタグ・manifest・Cargo.toml を揃えておく (pack-release.ps1 が確かめる)
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/alc-cam.msi dist/alc-cam-extension.zip dist/alc-cam-host.exe dist/alc-cam.json --generate-notes

  # green の PR を merge する (ippoan/ci-workflows の reusable。merge は GitHub App の token で行う)。
  # デプロイはここではしない (ingest は merge 後に deploy.yml が出す)。windows も PR で走るので needs に入れる
  auto-merge:
    name: Auto Merge
    needs: [test, ingest, windows]
    if: github.event_name == 'pull_request' && needs.test.result == 'success' && needs.ingest.result == 'success' && needs.windows.result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
      # 無いと startup_failure になる
      checks: read
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
