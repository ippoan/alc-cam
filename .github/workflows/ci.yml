# PR / main: Rust のテストと Windows 向けの host のビルド。タグ v* では Windows 一式を Release に添付する。
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # SD 録画の切り出しの Worker (ingest/、wasm32 専用の別 workspace)。デプロイはしない (手で wrangler deploy)
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ingest
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install -q worker-build@0.8.7 && worker-build --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p alc-cam-host
      - name: パッケージ (host + install.ps1 + 拡張)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/alc-cam | Out-Null
          Copy-Item target/release/alc-cam-host.exe, host/install.ps1 dist/alc-cam/
          Copy-Item -Recurse extension dist/alc-cam/extension
          Compress-Archive -Path dist/alc-cam/* -DestinationPath dist/alc-cam-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alc-cam-windows
          path: dist/alc-cam-windows.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/alc-cam-windows.zip --generate-notes
